name: Model checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  simulation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run simulation invariants
        run: npm test
