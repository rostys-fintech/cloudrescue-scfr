<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1888D5"><meta name="description" content="WortWelt – тренажер німецьких артиклів і слів із фотографіями.">
<link rel="manifest" href="manifest.webmanifest">
<title>WortWelt · Німецька щодня</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17334b;background:#eef5f8;--blue:#1687d6;--dark:#113958;--muted:#597588;--border:#dce6ee;--card:#fff;--teal:#00ad90}
*{box-sizing:border-box}body{margin:0;padding:0 0 100px;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.top{background:linear-gradient(115deg,#147acb,#27a7e9);color:white;box-shadow:0 6px 25px #196d9c20}
.topinner{max-width:1160px;margin:auto;padding:21px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.brand{font-size:26px;font-weight:930;letter-spacing:-1.1px}.brand span{color:#c7fcff}.right{display:flex;gap:10px;align-items:center}.pill{border-radius:100px;background:#ffffff24;padding:7px 13px;font-size:12px;font-weight:750}
.lang{display:flex;gap:4px;border-radius:14px;padding:5px;background:#ffffff1b}.lang button{border:0;border-radius:10px;background:transparent;color:#e8f6ff;font-weight:850;padding:7px 12px}.lang button.active{background:white;color:#147acb}
.wrap{max-width:1160px;margin:auto;padding:25px 20px}.headerline{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
h1,h2,h3,p{margin-top:0}h1{font-size:clamp(30px,5vw,52px);line-height:1.08;letter-spacing:-2px;margin:7px 0 12px}h2{font-size:23px;letter-spacing:-.6px}p{line-height:1.54}
.eyebrow{color:#2288c5;font-size:12px;letter-spacing:2px;font-weight:900;text-transform:uppercase}
.muted{color:var(--muted)}.hero{background:linear-gradient(130deg,#fff,#f5fbff);border:1px solid var(--border);border-radius:28px;padding:clamp(22px,4vw,38px);display:grid;grid-template-columns:1fr auto;gap:20px;box-shadow:0 15px 44px #1a5f8511}
.heroicon{font-size:95px;align-self:center;filter:drop-shadow(0 10px 15px #116cb533)}
.primary{border:0;border-radius:16px;background:var(--blue);color:white;padding:13px 20px;font-weight:850;box-shadow:0 5px 13px #1687d526}.secondary{border:1px solid var(--border);border-radius:14px;background:white;color:var(--dark);padding:10px 15px;font-weight:760}.secondary:hover,.primary:hover{filter:brightness(.96)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin:20px 0 30px}.stat{background:white;border:1px solid var(--border);padding:18px;border-radius:18px}.stat b{font-size:26px;display:block}.stat small{color:var(--muted)}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 20px}.search{flex:1;min-width:210px;padding:13px 17px;border-radius:14px;border:1px solid var(--border);outline:none;background:white}.search:focus{border-color:#48b8dc;box-shadow:0 0 0 4px #64bbdb20}
.topicgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.topic{padding:15px;background:white;border-radius:20px;border:1px solid var(--border);display:flex;align-items:center;gap:13px;text-align:left;color:inherit;min-width:0}.topic:hover{border-color:#5bbbe4;transform:translateY(-1px)}.topicicon{width:65px;height:65px;flex:0 0 65px;border-radius:16px;background:linear-gradient(135deg,#d7f3fb,#f3dff2);display:grid;place-items:center;font-size:32px}.topicinfo{min-width:0}.topicinfo strong{font-size:14px;line-height:1.3;display:block}.topicinfo small{color:#638298;display:block;margin-top:4px;font-size:12px}
.gamebox{max-width:640px;margin:0 auto}.gamecard{border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 17px 55px #225b7a21;border:1px solid #dce8ec}.imagebox{height:clamp(290px,47vh,440px);position:relative;background:linear-gradient(130deg,#cceafa,#62bbd8);display:grid;place-items:center;overflow:hidden}.imagebox img{height:100%;width:100%;object-fit:cover;position:absolute;inset:0}.imagebox .fallback{font-size:112px}.imagegradient{position:absolute;inset:auto 0 0;height:42%;background:linear-gradient(transparent,#0c2a42ae)}.wordoverlay{position:absolute;inset:auto 20px 22px;color:white;text-align:center;text-shadow:0 3px 12px #0018}.wordoverlay small{font-weight:800;letter-spacing:1.8px;opacity:.93}.wordoverlay strong{font-size:clamp(26px,5vw,44px);display:block;font-weight:900;line-height:1.13}.wordoverlay em{font-size:16px;font-style:normal;display:block;margin-top:5px}
.answers{padding:21px}.answergrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.answer{border-radius:18px;border:2px solid #dce8ec;background:#f9fcfe;padding:17px 10px;font-size:22px;font-weight:850;color:#143c59;min-height:74px}.answer:active{transform:scale(.97)}.answer.correct{background:#dcf8eb;border-color:#0cba82;color:#08785d}.answer.wrong{border-color:#ff7272;background:#ffe9e9;color:#b52133;animation:shake .3s}.answer.single{font-size:15px;line-height:1.3}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.star{font-size:27px;color:#c7dae2;letter-spacing:3px}.star .won{color:#ffd149;text-shadow:0 2px 6px #eea10040}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px}.toolbar .context{color:var(--muted);font-size:12px}.toolbar b{color:#18577d}.case-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}.case-row button{background:white;border:1px solid var(--border);border-radius:11px;padding:9px 12px;color:#3c647c;font-size:12px;font-weight:800}.case-row button.active{background:#1779bf;color:white;border-color:#1779bf}
.message{min-height:34px;display:flex;align-items:center;justify-content:center;padding:8px 0;color:#276c88;font-weight:750;text-align:center}.progressbar{height:8px;border-radius:50px;background:#d8e8f0;overflow:hidden;flex:1}.progressbar div{height:100%;background:#13b18a;border-radius:50px;transition:width .25s}
.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:10px;background:#ffffffee;border-top:1px solid #dbe7ed;padding:9px 12px calc(9px + env(safe-area-inset-bottom));box-shadow:0 -3px 20px #234d6510;backdrop-filter:blur(20px)}.nav button{border:0;background:transparent;min-width:80px;padding:8px 12px;border-radius:12px;font-size:12px;font-weight:800;color:#678296}.nav button.active{background:#e3f4fc;color:#007cc5}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.term{background:white;border:1px solid var(--border);padding:12px;border-radius:16px;display:flex;align-items:center;gap:10px;min-width:0}.term .thumb{width:63px;height:63px;border-radius:11px;object-fit:cover;flex:0 0 63px;background:#d8effa}.term .thumbfallback{width:63px;height:63px;border-radius:11px;display:grid;place-items:center;background:#d8effa;font-size:30px;flex:0 0 63px}.term span{min-width:0}.term b{display:block}.term small{display:block;color:#7890a0;margin-top:2px;line-height:1.45}.term .de{font-weight:900;font-size:15px}
.footer{margin-top:32px;color:#6c8898;font-size:12px;text-align:center}.footer a{color:#117eb4}.empty{border-radius:22px;background:white;border:1px solid var(--border);padding:28px;text-align:center}
.rowbtns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:10px}.hidden{display:none!important}
@media(max-width:760px){.topicgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.heroicon{font-size:70px}.list{grid-template-columns:1fr}}
@media(max-width:485px){.wrap{padding:16px 12px}.topinner{padding:13px 16px}.topicgrid{grid-template-columns:1fr 1fr;gap:10px}.topic{flex-direction:column;align-items:flex-start;gap:6px;padding:12px;min-height:140px}.topicicon{width:54px;height:54px;flex-basis:54px;font-size:26px}.topicinfo strong{font-size:13px}.stats{gap:6px}.stat{padding:11px}.stat b{font-size:20px}.stat small{font-size:10px}.heroicon{display:none}.hero{grid-template-columns:1fr}.nav{gap:0;justify-content:space-around}.nav button{min-width:66px;padding:8px 6px}.answers{padding:13px}.answer{padding:12px 5px;font-size:20px;min-height:66px}.gamecard{border-radius:21px}.wordoverlay{inset:auto 14px 15px}}
</style>
</head>
<body>
<header class="top"><div class="topinner"><div class="brand">Wort<span>Welt</span> 🇩🇪</div><div class="right"><span class="pill" id="coverage">91,30% · Fotos</span><div class="lang"><button id="uk" class="active" onclick="changeLang('uk')">UA</button><button id="en" onclick="changeLang('en')">EN</button></div></div></div></header>
<main class="wrap" id="main"><div class="empty">Завантажуємо словник WortWelt…</div></main>
<nav class="nav"><button id="nav-home" class="active" onclick="show('home')">🏠 <span data-t="home">Теми</span></button><button id="nav-game" onclick="resumeGame()">🎮 <span data-t="game">Гра</span></button><button id="nav-dictionary" onclick="show('dictionary')">📖 <span data-t="dictionary">Словник</span></button><button id="nav-progress" onclick="show('progress')">⭐ <span data-t="progress">Прогрес</span></button></nav>
<script>
"use strict";
let catalog={topics:[],words:[]},byId=new Map(),currentTopic=null,screen="home",selectedCase="Nominativ",language=localStorage.getItem("ww-pages-lang")==="en"?"en":"uk",game=null,answering=false,wrongChoice="",showMeaning=false,termFilter="",audioOn=true;
const KEY="ww-pages-progress-v1";
let progress;try{progress=JSON.parse(localStorage.getItem(KEY))||{streaks:{},correct:0,wrong:0,mastered:{},sessions:0}}catch{progress={streaks:{},correct:0,wrong:0,mastered:{},sessions:0}};
if(!progress.streaks)progress.streaks={};if(!progress.mastered)progress.mastered={};
const labels={uk:{home:"Теми",game:"Гра",dictionary:"Словник",progress:"Прогрес",hero:"Вивчай німецьку із задоволенням",sub:"Яскраві фото, артиклі та три зірки за три правильні відповіді поспіль.",start:"Почати гру",allTopics:"Обери тему",word:"сл.",search:"Пошук слова німецькою або українською",words:"Слів",illustrated:"З картинками",left:"Без картинок",learned:"Вивчено",correct:"Правильних",mistakes:"Помилок",pick:"Виберіть правильний артикль",again:"Спробуй ще раз",great:"Правильно!",finish:"Усі слова цієї теми вивчені!",next:"Далі →",showMeaning:"Показати переклад",download:"Зберегти прогрес",upload:"Відновити прогрес",note:"Прогрес у цьому браузері. Старий Vercel-сайт зберігає свої дані окремо.",meaning:"Переклад",all:"Усі теми",onlyNouns:"Іменники",practice:"Тренування",choose:"Почати",newRound:"Нове коло",photo:"Фото ілюстративне, не підказка",source:"Джерела фотографій",answer:"Обери правильний переклад",noresults:"Нічого не знайдено",pending:"Завантаження словника…",audio:"Вимова"},en:{home:"Topics",game:"Game",dictionary:"Dictionary",progress:"Progress",hero:"Learn German with joy",sub:"Beautiful photos, German articles and three stars for three correct answers in a row.",start:"Start playing",allTopics:"Choose your topic",word:"words",search:"Search German or English vocabulary",words:"Words",illustrated:"Illustrated",left:"Without images",learned:"Mastered",correct:"Correct",mistakes:"Mistakes",pick:"Choose the correct article",again:"Try again",great:"Correct!",finish:"You mastered all words in this topic!",next:"Next →",showMeaning:"Reveal translation",download:"Export progress",upload:"Import progress",note:"Progress is stored on this device. Previous Vercel progress remains separate.",meaning:"Translation",all:"All topics",onlyNouns:"Nouns",practice:"Practice",choose:"Start",newRound:"New round",photo:"Illustration, not a hint",source:"Photo credits",answer:"Choose the correct translation",noresults:"No matching words",pending:"Loading vocabulary…",audio:"Pronunciation"}};
function t(k){return labels[language][k]||k}function safe(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(progress))}catch{}}
function photoURL(w){return w.photo||null}function nounWords(){return catalog.words.filter(w=>w.kind==="noun")}
function count(){const a=nounWords();return [a.filter(w=>w.photo).length,a.length]}
function updateLanguage(){document.documentElement.lang=language;document.querySelector("#uk").classList.toggle("active",language==="uk");document.querySelector("#en").classList.toggle("active",language==="en");document.querySelectorAll("[data-t]").forEach(e=>{e.textContent=t(e.dataset.t)})}
function changeLang(v){language=v;localStorage.setItem("ww-pages-lang",v);updateLanguage();render()}
function topicsView(){const stats=count();return '<section class="hero"><div><span class="eyebrow">DEIN DEUTSCH. DEIN TEMPO.</span><h1>'+t("hero")+'</h1><p class="muted">'+t("sub")+'</p><button class="primary" onclick="startGame(null)">'+t("start")+' →</button></div><div class="heroicon">📚✨</div></section>'+
'<section class="stats"><div class="stat"><b>'+catalog.words.length+'</b><small>'+t("words")+'</small></div><div class="stat"><b>'+stats[0]+'/'+stats[1]+'</b><small>'+t("illustrated")+'</small></div><div class="stat"><b>'+Object.keys(progress.mastered).length+'</b><small>'+t("learned")+'</small></div></section>'+
'<div class="headerline"><h2>'+t("allTopics")+'</h2><span class="muted">'+catalog.topics.length+' · A1–A2</span></div>'+
'<div class="topicgrid">'+catalog.topics.map(x=>{const w=catalog.words.filter(z=>z.topic===x.id&&z.kind==="noun");return '<button class="topic" onclick="startGame('+JSON.stringify(x.id).replaceAll('"',"&quot;")+')"><div class="topicicon">'+safe(x.emoji||"📘")+'</div><div class="topicinfo"><strong>'+safe(language==="en"?x.de||x.name:x.name)+'</strong><small>'+safe(x.de)+' · '+w.length+' '+t("word")+'</small></div></button>'}).join("")+'</div>';
}
function chooseCase(c){selectedCase=c;render()}
function availablePool(topic){return catalog.words.filter(w=>w.kind==="noun" &&(!topic||w.topic===topic))}
function startGame(topic){const a=availablePool(topic);currentTopic=topic;game={pool:a.map(w=>w.id),selected:null,history:[]};const candidates=a.filter(w=>!progress.mastered[w.id]);game.selected=(candidates.length?candidates:a)[Math.floor(Math.random()*Math.max(1,(candidates.length?candidates:a).length))]?.id||null;answering=false;wrongChoice="";showMeaning=false;progress.sessions=(progress.sessions||0)+1;persist();show("game")}
function remaining(){return game?game.pool.filter(id=>!progress.mastered[id]):[]}
function shuffleNext(){if(!game)return;const left=remaining();const options=left.filter(id=>id!==game.selected&&!game.history.slice(-2).includes(id));const pool=options.length?options:left;game.selected=pool[Math.floor(Math.random()*pool.length)]||null;if(game.selected)game.history.push(game.selected);answering=false;wrongChoice="";showMeaning=false;render()}
function resumeGame(){if(!game||!game.selected){startGame(null)}else show("game")}
function correctFor(w){const x={Nominativ:{der:"der",die:"die",das:"das"},Akkusativ:{der:"den",die:"die",das:"das"},Dativ:{der:"dem",die:"der",das:"dem"},Genitiv:{der:"des",die:"der",das:"des"}};return x[selectedCase][w.gender]}
function playTone(good){if(!audioOn)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A(),o=c.createOscillator(),gain=c.createGain();o.type="sine";o.frequency.setValueAtTime(good?620:220,c.currentTime);if(good)o.frequency.exponentialRampToValueAtTime(880,c.currentTime+.17);gain.gain.setValueAtTime(.035,c.currentTime);gain.gain.exponentialRampToValueAtTime(.001,c.currentTime+.23);o.connect(gain);gain.connect(c.destination);o.start();o.stop(c.currentTime+.24);o.onended=()=>c.close()}catch{}}
function pronounce(w){if(!audioOn||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w.gender+" "+w.de);u.lang="de-DE";u.rate=.83;speechSynthesis.speak(u)}catch{}}
function chooseAnswer(a){if(!game?.selected||answering)return;const w=byId.get(game.selected),right=correctFor(w);if(a===right){answering=true;wrongChoice="";showMeaning=true;progress.correct++;const s=Math.min(3,(progress.streaks[w.id]||0)+1);progress.streaks[w.id]=s;if(s>=3)progress.mastered[w.id]=true;playTone(true);pronounce(w)}else{progress.wrong++;progress.streaks[w.id]=0;wrongChoice=a;playTone(false)}persist();render()}
function articleStars(w){const s=Math.min(3,progress.streaks[w.id]||0);return '<div class="star">'+[0,1,2].map(i=>'<span'+(i<s?' class="won"':'')+'>★</span>').join('')+'</div>'}
function imageMarkup(w){return '<div class="imagebox"><div class="fallback" id="fallback">'+safe(w.emoji||"🖼️")+'</div>'+(photoURL(w)?'<img src="'+safe(photoURL(w))+'" alt="" referrerpolicy="no-referrer" loading="eager" onload="this.previousElementSibling.style.display=\'none\'" onerror="this.style.display=\'none\'">':'')+'<div class="imagegradient"></div><div class="wordoverlay"><small>'+safe((catalog.topics.find(x=>x.id===w.topic)||{}).de||"WortWelt")+'</small><strong>'+safe(w.de)+'</strong>'+(showMeaning?'<em>'+safe(language==="en"?w.en||w.uk:w.uk)+'</em>':'')+'</div></div>'}
function gameView(){if(!game)return '<div class="empty"><h2>'+t("practice")+'</h2><button class="primary" onclick="startGame(null)">'+t("start")+'</button></div>';const w=byId.get(game.selected);if(!w)return '<div class="empty"><h2>🎉 '+t("finish")+'</h2><div class="rowbtns"><button class="secondary" onclick="show(\'home\')">'+t("home")+'</button><button class="primary" onclick="startGame(currentTopic)">'+t("newRound")+'</button></div></div>';
const opts=selectedCase==="Dativ"?["dem","der"]:selectedCase==="Genitiv"?["des","der"]:selectedCase==="Akkusativ"?["den","die","das"]:["der","die","das"];
const active=(catalog.topics.find(x=>x.id===currentTopic)||{name:t("all")});const pool=availablePool(currentTopic),done=pool.filter(x=>progress.mastered[x.id]).length;
return '<div class="gamebox"><div class="toolbar"><button class="secondary" onclick="show(\'home\')">← '+t("home")+'</button><div style="text-align:right"><b>'+safe(language==="en"?(active.de||active.name):active.name)+'</b><div class="context">'+done+'/'+pool.length+' '+t("learned")+'</div></div></div>'+
'<div class="case-row">'+["Nominativ","Akkusativ","Dativ","Genitiv"].map(c=>'<button class="'+(selectedCase===c?"active":"")+'" onclick="chooseCase(\''+c+'\')">'+c+'</button>').join("")+'</div>'+
'<div class="gamecard">'+imageMarkup(w)+'<div class="answers"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px"><div><div class="muted" style="font-size:12px">'+t("pick")+'</div>'+articleStars(w)+'</div><button class="secondary" aria-label="'+t("audio")+'" onclick="pronounce(byId.get(game.selected))">🔊</button></div>'+
'<div class="answergrid">'+opts.map(x=>'<button class="answer '+(answering&&x===correctFor(w)?"correct":wrongChoice===x?"wrong":"")+'" onclick="chooseAnswer(\''+x+'\')"'+(answering?' disabled':'')+'>'+x+'</button>').join("")+'</div>'+
'<div class="message">'+(answering?(progress.streaks[w.id]===3?'⭐⭐⭐ '+t("great"):'✅ '+t("great")+' '+correctFor(w)+' '+w.de):wrongChoice?'↩ '+t("again"):'&nbsp;')+'</div>'+
'<div class="rowbtns"><button class="secondary" onclick="pronounce(byId.get(game.selected))">🔊 '+t("audio")+'</button>'+(answering?'<button class="primary" onclick="shuffleNext()">'+t("next")+'</button>':'')+'</div></div></div></div>';
}
function dictionaryView(){const q=termFilter.trim().toLowerCase(),items=catalog.words.filter(w=>(w.de+" "+w.uk+" "+(w.en||"")).toLowerCase().includes(q)).slice(0,240);
return '<div class="headerline"><h1>📖 '+t("dictionary")+'</h1><span class="muted">'+catalog.words.length+' '+t("words")+'</span></div><div class="controls"><input class="search" id="searchterm" placeholder="'+t("search")+'" value="'+safe(termFilter)+'" oninput="filterDictionary(this.value)"/><button class="secondary" onclick="filterDictionary(\'\')">✕</button></div><div class="list" id="term-list">'+(items.length?items.map(w=>'<article class="term">'+(w.photo?'<img class="thumb" src="'+safe(w.photo)+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=\'<span class=thumbfallback>📚</span>\'">':'<span class="thumbfallback">'+safe(w.emoji||"📖")+'</span>')+'<span><span class="de">'+safe(w.gender?w.gender+" "+w.de:w.de)+'</span><small>'+safe(language==="en"?w.en||w.uk:w.uk)+'</small></span></article>').join(""):'<div class="empty">'+t("noresults")+'</div>')+'</div>';
}
function filterDictionary(s){termFilter=s;const focused=document.activeElement?.id==="searchterm";const pos=focused?document.activeElement.selectionStart:null;render();if(focused){const input=document.querySelector("#searchterm");input?.focus();if(pos!==null)input?.setSelectionRange(pos,pos)}}
function progressView(){const pic=count();return '<h1>⭐ '+t("progress")+'</h1><div class="stats"><div class="stat"><b>'+Object.keys(progress.mastered).length+'</b><small>'+t("learned")+'</small></div><div class="stat"><b>'+progress.correct+'</b><small>'+t("correct")+'</small></div><div class="stat"><b>'+progress.wrong+'</b><small>'+t("mistakes")+'</small></div></div>'+
'<div class="empty"><h2>'+pic[0]+'/'+pic[1]+' · '+(pic[0]/pic[1]*100).toFixed(2)+'%</h2><div class="progressbar"><div style="width:'+(pic[0]/pic[1]*100)+'%"></div></div><p class="muted" style="margin-top:14px">'+t("note")+'</p><div class="rowbtns"><button class="primary" onclick="exportProgress()">'+t("download")+'</button><button class="secondary" onclick="document.querySelector(\'#importfile\').click()">'+t("upload")+'</button><input type="file" id="importfile" accept=".json,application/json" class="hidden" onchange="importProgress(this.files[0])"></div></div>';
}
function exportProgress(){const blob=new Blob([JSON.stringify({version:1,progress,language,source:"WortWelt Pages"})],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="wortwelt-progress.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
async function importProgress(file){if(!file)return;try{const d=JSON.parse(await file.text());if(!d.progress?.streaks||!d.progress?.mastered)throw Error("not compatible");progress=d.progress;persist();render();alert("✓ "+t("progress"))}catch{alert("Cannot import this file")}}
function show(s){screen=s;render();window.scrollTo({top:0,behavior:"instant"})}
function render(){const node=document.getElementById("main");if(screen==="home")node.innerHTML=topicsView();if(screen==="game")node.innerHTML=gameView();if(screen==="dictionary")node.innerHTML=dictionaryView();if(screen==="progress")node.innerHTML=progressView();
["home","game","dictionary","progress"].forEach(s=>document.getElementById("nav-"+s).classList.toggle("active",screen===s));updateLanguage();
const c=count();document.getElementById("coverage").textContent=(c[0]/c[1]*100).toFixed(2).replace(".",",")+"% · "+c[0]+"/"+c[1];
if(screen==="home"||screen==="dictionary"||screen==="progress")node.insertAdjacentHTML("beforeend",'<footer class="footer">WortWelt · Open learning · <a href="credits.html">'+t("source")+'</a> · <a href="https://github.com/rostys-fintech/wortwelt-de-ua" target="_blank" rel="noopener">GitHub</a></footer>');
}
async function init(){try{const r=await fetch("vocabulary.json",{cache:"no-cache"});if(!r.ok)throw Error("Vocabulary HTTP "+r.status);catalog=await r.json();if(!Array.isArray(catalog.words)||catalog.words.length<1000)throw Error("Missing words");byId=new Map(catalog.words.map(w=>[w.id,w]));render();}catch(e){document.getElementById("main").innerHTML='<div class="empty"><h2>Помилка завантаження словника</h2><p>'+safe(e.message)+'</p><button class="primary" onclick="location.reload()">↻ Оновити</button></div>'}}
init();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
