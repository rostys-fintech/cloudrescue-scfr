<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WortWelt — Фото та ліцензії</title><style>body{font:15px system-ui;background:#f1f7fa;color:#17334b;margin:0}main{max-width:950px;margin:auto;padding:24px}h1{font-size:35px}a{color:#1377b9}p{line-height:1.5}.info{background:white;border:1px solid #dce6ef;border-radius:16px;padding:18px}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:16px 0}.item{background:white;border:1px solid #dce7ee;border-radius:15px;padding:14px}.item strong{display:block}.item small{display:block;color:#678296;margin:6px 0;overflow-wrap:anywhere}</style></head><body><main><a href="./">← WortWelt</a><h1>Фото та ліцензії</h1><div class="info">490 зображень із Wikimedia Commons використовуються з посиланням на їхніх авторів та умови ліцензування. Власні SVG-ілюстрації створено для WortWelt. На кожне фото можна перейти до першоджерела. Зображення не є підказками до відповіді.</div><div class="list" id="list">Завантаження…</div></main><script>function h(x){return String(x||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}fetch("credits.json").then(r=>r.json()).then(rows=>{document.querySelector("#list").innerHTML=rows.map(x=>'<div class="item"><strong>'+h(x.w)+'</strong><small>'+h(x.author)+'</small><small>'+h(x.license)+'</small><a target="_blank" rel="noopener noreferrer" href="'+h(x.source)+'">Джерело та ліцензія →</a></div>').join("")}).catch(()=>document.querySelector("#list").textContent="Не вдалося завантажити авторів")</script></body></html>
